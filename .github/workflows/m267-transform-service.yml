name: M267 asserted public service namespace transform

on:
  pull_request:
    branches:
      - m267-llm-naming

permissions:
  contents: write

jobs:
  transform:
    if: github.event.pull_request.head.ref == 'm267-candidate-service-entrypoints'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m267-candidate-service-entrypoints
          fetch-depth: 0
      - name: Apply exact asserted transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          mapping = {
              'openai_ask': 'llm_ask',
              'openai_chat': 'llm_chat',
              'openai_chat_reset': 'llm_chat_reset',
              'openai_chat_active': 'llm_chat_active',
              'openai_review_file': 'llm_review_file',
          }
          expected = {
              'SRC/LLM.H': {
                  'openai_ask': 1,
                  'openai_chat': 1,
                  'openai_chat_reset': 1,
                  'openai_chat_active': 1,
                  'openai_review_file': 1,
              },
              'SRC/LLM_INTERNAL_CORE.H': {
                  'openai_ask': 1,
                  'openai_chat': 1,
                  'openai_chat_reset': 1,
                  'openai_chat_active': 1,
                  'openai_review_file': 1,
              },
              'SRC/LLM_STATUS_CORE.INC': {
                  'openai_ask': 1,
                  'openai_chat': 1,
                  'openai_chat_reset': 1,
                  'openai_chat_active': 1,
                  'openai_review_file': 1,
              },
              'SRC/COMMAND_AGENT.C': {
                  'openai_ask': 1,
                  'openai_chat': 1,
                  'openai_chat_reset': 1,
                  'openai_chat_active': 0,
                  'openai_review_file': 1,
              },
          }

          total = 0
          for path, counts in expected.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in mapping.items():
                  rx = re.compile(r'(?<![A-Za-z0-9_])' + re.escape(old) + r'(?![A-Za-z0-9_])')
                  found = len(rx.findall(text))
                  want = counts[old]
                  if found != want:
                      raise SystemExit(f'{path}: expected {want} exact {old} occurrences, found {found}')
                  text = rx.sub(new, text)
                  total += found
              if path == 'SRC/LLM_STATUS_CORE.INC':
                  old_s = '(void)puts("OpenAI conversation reset.");'
                  new_s = '(void)puts("LLM conversation reset.");'
                  if text.count(old_s) != 1:
                      raise SystemExit(f'{path}: expected exactly one reset wording string')
                  text = text.replace(old_s, new_s)
              if text == original:
                  raise SystemExit(f'{path}: transformation produced no change')
              p.write_text(text, encoding='utf-8')

          if total != 19:
              raise SystemExit(f'expected 19 identifier substitutions, got {total}')

          for path in expected:
              text = Path(path).read_text(encoding='utf-8')
              for old in mapping:
                  rx = re.compile(r'(?<![A-Za-z0-9_])' + re.escape(old) + r'(?![A-Za-z0-9_])')
                  if rx.search(text):
                      raise SystemExit(f'{path}: survivor {old}')
          print('asserted identifier substitutions: 19')
          print('asserted wording substitutions: 1')
          PY
      - name: Remove helper workflow and publish candidate tree
        shell: bash
        run: |
          rm .github/workflows/m267-transform-service.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SRC/LLM.H SRC/LLM_INTERNAL_CORE.H SRC/LLM_STATUS_CORE.INC SRC/COMMAND_AGENT.C
          git add -u .github/workflows/m267-transform-service.yml
          git diff --cached --check
          git commit -m 'M267: migrate public LLM service entrypoints'
          git push origin HEAD:m267-candidate-service-entrypoints

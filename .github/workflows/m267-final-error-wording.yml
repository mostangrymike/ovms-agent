name: M267 final API error wording cleanup

on:
  pull_request:
    branches: [m267-llm-naming]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m267-final-audit-6c0
          fetch-depth: 0
      - name: Neutralize visible API error wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          targets={'SRC/LLM_RESPONSE.C':2,'doc/parity_audit_m259.md':1}
          old='OpenAI API error:'; new='Provider API error:'
          for name,count in targets.items():
              p=pathlib.Path(name); text=p.read_text(encoding='utf-8')
              if text.count(old)!=count:
                  raise SystemExit(f'{name}: expected {count}, found {text.count(old)}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Publish cleanup and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m267-final-error-wording.yml
          git add SRC/LLM_RESPONSE.C doc/parity_audit_m259.md
          git commit -m 'M267: neutralize provider API error wording'
          git push origin HEAD:m267-final-audit-6c0

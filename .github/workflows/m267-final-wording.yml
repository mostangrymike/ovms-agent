name: M267 final provider wording cleanup

on:
  pull_request:
    branches: [m267-llm-naming]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m267-final-audit-6c0
          fetch-depth: 0
      - name: Neutralize missing-key diagnostics and verify survivors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, subprocess
          targets = {
              'SRC/LLM_AGENT_LOOP.C': 1,
              'SRC/LLM_BUILD_CORE.INC': 1,
              'SRC/LLM_CREATE_CORE.INC': 1,
          }
          old = 'OPENAI_API_KEY is not defined.'
          new = 'Provider API key is not defined.'
          for name,count in targets.items():
              p=pathlib.Path(name); text=p.read_text(encoding='utf-8')
              if text.count(old) != count:
                  raise SystemExit(f'{name}: expected {count} missing-key diagnostic, found {text.count(old)}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          # Remaining prefixed legacy tokens are compatibility literals only.
          token_re=re.compile(r'\b(?:openai_[A-Za-z0-9_]+|OPENAI_[A-Za-z0-9_]+)\b')
          allowed={'OPENAI_API_KEY','OPENAI_TEST_HEADERS','OPENAI_MODELS'}
          bad=[]; residual=[]
          for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              if name == '.github/workflows/m267-final-wording.yml': continue
              try: text=pathlib.Path(name).read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              for n,line in enumerate(text.splitlines(),1):
                  for tok in token_re.findall(line):
                      if tok not in allowed: bad.append((name,n,tok))
                  if re.search(r'(?i)openai',line): residual.append((name,n,line.strip()))
          if bad: raise SystemExit(f'unjustified prefix survivors: {bad[:50]}')
          if any('openai' in p.lower() for p in subprocess.check_output(['git','ls-files'],text=True).splitlines()):
              raise SystemExit('OpenAI-named tracked path remains')
          print('M267_FINAL_WORDING_OK')
          print('RESIDUAL_BEGIN')
          for row in residual: print(f'{row[0]}:{row[1]}:{row[2]}')
          print('RESIDUAL_END')
          PY
          git diff --check
      - name: Publish cleanup and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m267-final-wording.yml
          git add SRC/LLM_AGENT_LOOP.C SRC/LLM_BUILD_CORE.INC SRC/LLM_CREATE_CORE.INC
          git commit -m 'M267: neutralize provider key diagnostics'
          git push origin HEAD:m267-final-audit-6c0
